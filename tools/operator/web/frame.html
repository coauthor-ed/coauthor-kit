<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Device frame</title>
<style>
  /* Tokens mirror the authoring app palette (coauthor src/ui/theme.css), light + dark. */
  :root { --bg:#f1f5f9; --ink:#0f172a; --line:#cbd5e1; --card:#ffffff; --acc:#4f46e5; --acc-l:#eef2ff; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#090d16; --ink:#f8fafc; --line:#334155; --card:#131b2e; --acc:#818cf8; --acc-l:#1e1b4b; } }
  :root[data-theme="dark"] { --bg:#090d16; --ink:#f8fafc; --line:#334155; --card:#131b2e; --acc:#818cf8; --acc-l:#1e1b4b; }
  /* The device keeps its exact size; the review panel (rendered here, not inside the device) sits beside it, or below when the window is narrow. */
  .stage { display:flex; flex-wrap:wrap; gap:16px; justify-content:center; align-items:stretch; max-width:100%; }
  #slot { width:360px; max-width:100%; flex:none; min-height:120px; }
  .stage[data-dock="left"] { flex-direction:row-reverse; }
  .stage[data-dock="top"] { flex-direction:column-reverse; flex-wrap:nowrap; align-items:center; } .stage[data-dock="bottom"] { flex-direction:column; flex-wrap:nowrap; align-items:center; }
  .stage[data-dock="top"] #slot, .stage[data-dock="bottom"] #slot { width:min(100%, 760px); min-height:0; }
  .stage[data-dock="float"] #slot { width:0; min-height:0; height:0; margin-left:-16px; overflow:visible; }
  body { margin:0; background:var(--bg); color:var(--ink); font:600 14px 'Nunito', system-ui, sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px; }
  nav { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; } nav a { padding:6px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:inherit; text-decoration:none; } nav a:hover { border-color:var(--acc); } nav a:focus-visible { outline:2px solid var(--acc); outline-offset:2px; } nav a.on { border-color:var(--acc); background:var(--acc-l); color:var(--acc); }
  .dev { border:2px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card); max-width:100%; }
  iframe { border:0; display:block; width:100%; height:100%; }
</style>
</head>
<body>
<nav id="nav"></nav>
<div class="stage" id="stage"><div class="dev" id="dev"><iframe id="f" title="app"></iframe></div><div id="slot"></div></div>
<script>
// The kit page embeds the engine (the engine's CSP has no frame-src, but frame-ancestors is not set, so this direction works).
const p = new URLSearchParams(location.search); const src = p.get('src'); const dev = p.get('device') || 'phone';
const SIZES = { phone: [390, 800], tablet: [820, 1100], desktop: [1280, 720] };
const nav = document.getElementById('nav');
for (const k of Object.keys(SIZES)) { const a = document.createElement('a'); a.textContent = `${k} ${SIZES[k].join('x')}`; const q = new URLSearchParams(p); q.set('device', k); a.href = '?' + q; if (k === dev) a.className = 'on'; nav.append(a); }
const [w, h] = SIZES[dev] || SIZES.phone; const d = document.getElementById('dev'); d.style.width = w + 'px'; d.style.height = h + 'px';
d.style.flex = 'none';
if (src && /^https?:\/\//.test(src)) {
  // The review panel (one implementation: /review-bar.js) runs here as role 'host' and talks to the engine page in the iframe by postMessage.
  window.__kitHost = { frame: document.getElementById('f'), slot: document.getElementById('slot'), stage: document.getElementById('stage'), dev: d };
  import('/review-bar.js').catch(() => {}).finally(() => { document.getElementById('f').src = src; });
}
</script>
</body>
</html>
